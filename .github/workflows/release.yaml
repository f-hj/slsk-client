name: Release

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")

          echo "Package: $PKG_NAME"
          echo "Version: $VERSION"

          # Check if this version is already published on npm
          if npm view "${PKG_NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version ${VERSION} of ${PKG_NAME} is already published on npm. Skipping publish."
          else
            echo "Publishing ${PKG_NAME}@${VERSION} to npm..."
            if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
              echo "Using NPM_TOKEN from repository secrets."
              npm config set //registry.npmjs.org/:_authToken "${{ secrets.NPM_TOKEN }}"
            else
              echo "Using npm Trusted Publishing (OIDC)."
            fi

            npm publish --access public --provenance
            echo "Successfully published ${PKG_NAME}@${VERSION} to npm."

            TAG="v${VERSION}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating GitHub release $TAG..."
              gh release create "$TAG" --title "$TAG" --generate-notes || echo "Release creation skipped or already exists."
            fi
          fi
